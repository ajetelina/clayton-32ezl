<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lot Card</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    /* The model's lot cards (2026-11-04): one letter-size landscape page a retailer prints for the model or the
       sales office; buyers scan the QR to open the model page. Three layouts from one data file, picked by ?style=:
       photo, collage, plain. Aaron's review (10.22 PM): the customer sees these, so the builder's logo and no
       WTXmedia credit; daylight exteriors; the description on the photo cards; the QR as big as the space allows.
       10.55 PM: the photo card's photo carries no text (the name block sits under it, as on the collage), and a Clayton Blue
       line separates the name from what follows on every card; the plain card keeps only beds, baths and square feet.
       The build prints each to a PDF; the bar's Download button hands over that PDF. */
    @page { size: letter landscape; margin: 0; }
    :root { --ink: #14202e; --body: #445163; --mute: #6f7b8b; --line: #dde3ea; --navy: #2f4a68; --navy-ink: #0f1c2b; --steel: #9fc3ea; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Barlow", Arial, sans-serif; background: #d9dee4; color: var(--body); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .bar { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 16px; }
    .bar a, .bar button { font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; padding: 10px 20px; background: #fff; color: var(--navy); border: 1.5px solid var(--navy); cursor: pointer; text-decoration: none; }
    .bar .on { background: var(--navy-ink); color: #fff; border-color: var(--navy-ink); }
    .bar .act { background: var(--navy); color: #fff; }
    .bar .gap { width: 18px; }
    .card { width: 11in; height: 8.5in; margin: 0 auto 30px; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.18); overflow: hidden; position: relative; }
    .card img.ph { width: 100%; height: 100%; object-fit: cover; display: block; }
    .kicker { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 15pt; letter-spacing: .22em; text-transform: uppercase; color: var(--navy); }
    .kicker span { display: inline-block; width: 1px; height: .9em; background: #b9c6d4; margin: 0 12px; vertical-align: -.1em; }
    h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; line-height: .95; color: var(--ink); }
    .stats { display: flex; gap: .35in; }
    .stats b { display: block; font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 30pt; line-height: 1; color: var(--ink); }
    .stats span { font-size: 9.5pt; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
    .spec { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 12.5pt; letter-spacing: .14em; text-transform: uppercase; color: var(--navy); }
    .desc { font-size: 11pt; line-height: 1.45; color: var(--body); }
    .logo { width: auto; display: block; }
    .qr { text-align: center; }
    .qr svg { display: block; margin: 0 auto; }
    .qr b { display: block; margin-top: 8px; font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 15pt; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
    .qr span { display: block; font-size: 10pt; color: var(--mute); }
    .rule { height: 4px; background: #0071c8; }

    /* photo: the daylight front alone; under it the name block, a blue line, specs, description, logo; a big QR at the right */
    .photo { display: grid; grid-template-rows: 3.9in 1fr; }
    .photo .top { overflow: hidden; }
    .photo .lower { display: grid; grid-template-columns: 1fr 3.2in; gap: .4in; padding: .3in .5in .3in; align-items: center; }
    .photo .kicker { font-size: 12pt; }
    .photo h1 { font-size: 40pt; margin-top: 4px; }
    .photo .rule { margin: .14in 0 .16in; }
    .photo .spec { margin-top: 8px; font-size: 11.5pt; }
    .photo .desc { margin-top: 8px; font-size: 10.5pt; }
    .photo .logo { height: .4in; margin-top: 14px; }
    .photo .qr svg { width: 2.9in; height: 2.9in; }

    /* collage: the exterior and two rooms at the left; the logo, name, description and a big QR at the right */
    .collage { display: grid; grid-template-columns: 6.5in 1fr; }
    .collage .pics { display: grid; grid-template-rows: 5.1in 1fr; gap: .08in; }
    .collage .pics .two { display: grid; grid-template-columns: 1fr 1fr; gap: .08in; min-height: 0; }
    .collage .pics > *, .collage .pics .two > * { overflow: hidden; min-height: 0; }
    .collage .side { padding: .55in .4in .35in; display: flex; flex-direction: column; }
    .collage .logo { height: .5in; align-self: flex-start; margin-bottom: .22in; }
    .collage .kicker { font-size: 11pt; }
    .collage h1 { font-size: 38pt; margin-top: 4px; }
    .collage .rule { margin: .14in 0 .12in; }
    .collage .spec { font-size: 11pt; line-height: 1.45; }
    .collage .desc { margin-top: 10px; font-size: 10pt; }
    .collage .qr { margin-top: auto; }
    .collage .qr svg { width: 3.05in; height: 3.05in; }
    .collage .qr b { font-size: 14pt; }

    /* plain: no photos; the logo and name at the top, the QR as big as the page allows */
    .plain { display: flex; flex-direction: column; align-items: center; text-align: center; padding: .38in .5in .3in; }
    .plain .logo { height: .62in; margin-bottom: .14in; }
    .plain h1 { font-size: 52pt; }
    .plain .kicker { margin-top: 6px; font-size: 13pt; }
    .plain .rule { width: 1.4in; margin: .16in auto .16in; }
    .plain .stats { justify-content: center; gap: .45in; }
    .plain .stats b { font-size: 26pt; }
    .plain .qr { margin-top: .2in; }
    .plain .qr svg { width: 4.15in; height: 4.15in; }

    @media print { body { background: #fff; } .bar { display: none; } .card { margin: 0; box-shadow: none; } }
    @media screen and (max-width: 1100px) { .card { zoom: .5; } }
  </style>
</head>
<body>
  <div class="bar" id="bar"></div>
  <div class="card" id="card"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="data/model.js"></script>
  <script>
    const M = window.MODEL, $ = s => document.querySelector(s), title = M.name || M.number;
    const style = new URLSearchParams(location.search).get('style') || 'photo';
    const full = id => `img/full/${id}.jpg`;
    document.title = `Lot card – ${M.builder.name} ${title}`;
    // the card's own PDF, from the page's card list (the build prints one per layout)
    const pdf = (M.cards.find(c => c[2].endsWith('style=' + style)) || [])[3];
    $('#bar').innerHTML = ['photo', 'collage', 'plain'].map(s => `<a href="?style=${s}" class="${s === style ? 'on' : ''}">${s}</a>`).join('')
      + '<span class="gap"></span>'
      + (pdf ? `<a class="act" href="${pdf}" download>Download</a>` : '')
      + '<button type="button" class="act" onclick="window.print()">Print</button>';

    const kicker = M.name ? `${M.builder.name}<span></span>${M.number}` : M.builder.name;
    const stats = M.stats.slice(0, 3).map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join('');
    const [size, section, year] = M.stats.slice(3).map(s => s[0]);
    const spec = [size, `${section} section`, `${year} model`, M.plant + ' plant'];
    const qr = qrcode(0, 'M'); qr.addData(M.url); qr.make();
    const qrSvg = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
    const scan = `<b>Scan for the full tour</b><span>Photos, video and the 3D walkthrough</span>`;
    const logo = `<img class="logo" src="${M.builder.logo_color}" alt="${M.builder.name}" />`;
    const ext = full(M.exterior.day || M.exterior.twilight);   // daylight by default (Aaron 11-04)
    const card = $('#card');
    card.classList.add(style);

    if (style === 'collage') {
      // the exterior and two rooms: the first photo of the first two room groups (living, kitchen)
      const [a, b] = [M.groups[0].photos[0].id, M.groups[1].photos[0].id];
      card.innerHTML = `<div class="pics"><div><img class="ph" src="${ext}" alt="" /></div>
          <div class="two"><div><img class="ph" src="${full(a)}" alt="" /></div><div><img class="ph" src="${full(b)}" alt="" /></div></div></div>
        <div class="side">${logo}<p class="kicker">${M.number}</p><h1>${title}</h1>
          <div class="rule"></div>
          <p class="spec">${M.stats.slice(0, 3).map(([v, k]) => `${v} ${k}`).join(' · ')}<br>${spec.join(' · ')}</p>
          <p class="desc">${M.description || ''}</p>
          <div class="qr">${qrSvg}${scan}</div></div>`;
    } else if (style === 'plain') {
      card.innerHTML = `${logo}<h1>${title}</h1><p class="kicker">${M.name ? M.number : ''}</p>
        <div class="rule"></div><div class="stats">${stats}</div>
        <div class="qr">${qrSvg}${scan}</div>`;
    } else {
      card.innerHTML = `<div class="top"><img class="ph" src="${ext}" alt="" /></div>
        <div class="lower"><div><p class="kicker">${kicker}</p><h1>${title}</h1><div class="rule"></div>
          <div class="stats">${stats}</div><p class="spec">${spec.join(' · ')}</p>
          <p class="desc">${M.description || ''}</p>${logo}</div>
          <div class="qr">${qrSvg}${scan}</div></div>`;
    }
  </script>
</body>
</html>
